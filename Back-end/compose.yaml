name: academia

services:
  kafka:
    image: apache/kafka:4.0.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  alunos-db:
    image: postgres:17
    environment:
      POSTGRES_DB: alunos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ALUNOS_DB_PASSWORD:?Preencha ALUNOS_DB_PASSWORD no .env}
    volumes:
      - alunos-data:/var/lib/postgresql/data
      - ./db/alunos.sql:/docker-entrypoint-initdb.d/01-alunos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alunos"]
      interval: 5s
      timeout: 5s
      retries: 20

  aulas-db:
    image: postgres:17
    environment:
      POSTGRES_DB: aulas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AULAS_DB_PASSWORD:?Preencha AULAS_DB_PASSWORD no .env}
    volumes:
      - aulas-data:/var/lib/postgresql/data
      - ./db/aulas.sql:/docker-entrypoint-initdb.d/01-aulas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aulas"]
      interval: 5s
      timeout: 5s
      retries: 20

  alunos-service:
    build: ./alunos-service/alunos-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://alunos-db:5432/alunos
      DB_USER: postgres
      DB_PASSWORD: ${ALUNOS_DB_PASSWORD}
      TZ: America/Sao_Paulo
      API_USERNAME: ${ALUNOS_API_USERNAME:?Preencha ALUNOS_API_USERNAME no .env}
      API_PASSWORD: ${ALUNOS_API_PASSWORD:?Preencha ALUNOS_API_PASSWORD no .env}
    depends_on:
      alunos-db:
        condition: service_healthy

  frontend:
    build:
      context: ../Front-end
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      alunos-service:
        condition: service_started
      aula-service:
        condition: service_started

  notificacoes-service:
    build: ./notificacoes-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TZ: America/Sao_Paulo
    depends_on:
      kafka:
        condition: service_healthy

  aula-service:
    build: ./aula-service/aula-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: "8082"
      DB_URL: jdbc:postgresql://aulas-db:5432/aulas
      DB_USER: postgres
      DB_PASSWORD: ${AULAS_DB_PASSWORD}
      ALUNOS_SERVICE_URL: http://alunos-service:8081
      TZ: America/Sao_Paulo
      API_USERNAME: ${AULAS_API_USERNAME:?Preencha AULAS_API_USERNAME no .env}
      API_PASSWORD: ${AULAS_API_PASSWORD:?Preencha AULAS_API_PASSWORD no .env}
    depends_on:
      aulas-db:
        condition: service_healthy
      alunos-service:
        condition: service_started
      kafka:
        condition: service_healthy

volumes:
  alunos-data:
  aulas-data:
  kafka-data:

